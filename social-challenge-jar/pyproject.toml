[project]
name = "challenge-jar"
version = "0.1.0"
description = "Social Challenge Jar - graded real-world social exposure homework with prediction-gap tracking."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["challenge_jar*"]

[tool.setuptools.package-data]
challenge_jar = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
